name: ingest

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "push the packages to r2 (uncheck for a dry run)"
        type: boolean
        default: true
      limit:
        description: "only the first N sources (0 = all)"
        type: string
        default: "0"

env:
  R2_ACCOUNT_ID: f1b5019a1d5ee73f9494a30464733335

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the 2015 launcher is a RAR5 archive; unar and p7zip both mis-read it
      - run: sudo apt-get update && sudo apt-get install -y unrar
      - run: pip install boto3
      - env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python ingest.py \
            --limit ${{ inputs.limit }} \
            --merge \
            ${{ inputs.upload && '--upload' || '' }}
      # versions.json is the file to drop into openkogama/data
      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: |
            out/versions.json
            out/ingest.json
